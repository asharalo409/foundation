<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087a43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="মানবসেবা" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>মানবসেবা ফাউন্ডেশন</title>
    <meta
      name="description"
      content="মানবসেবা ফাউন্ডেশন: স্বচ্ছ হিসাব, জরুরি রক্তের আবেদন, ত্রাণ ও সমাজকল্যাণ। প্রতিটি অনুদান ও খরচ সবার জন্য খোলা।"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="bn_BD" />
    <meta property="og:site_name" content="মানবসেবা ফাউন্ডেশন" />
    <meta property="og:title" content="মানবসেবা ফাউন্ডেশন" />
    <meta
      property="og:description"
      content="মানুষের পাশে, মানবতার পাশে। স্বচ্ছ হিসাব, জরুরি রক্তের আবেদন ও ত্রাণ কার্যক্রম।"
    />
    <meta name="twitter:card" content="summary" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- এরর ট্র্যাকার স্ক্রিপ্ট (পেজ সাদা হয়ে আটকে থাকলে কারণ স্ক্রিনে দেখাবে) -->
    <script>
      (function () {
        function show(m) {
          var r = document.getElementById('root')
          if (!r || r.children.length) return
          r.innerHTML =
            '<div style="padding:16px;font:14px sans-serif;color:#7f1d1d;background:#fef2f2;min-height:100vh">' +
            '<b>পেজ চালু হয়নি</b>' +
            '<p>এই লেখার স্ক্রিনশট পাঠান।</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;background:#fff;color:#111;padding:10px;border-radius:8px">' +
            String(m).replace(/</g, '&lt;') +
            '</pre></div>'
        }
        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target !== window && e.target.tagName !== 'SCRIPT') return
            var m =
              e.message ||
              ('ফাইল লোড হয়নি: ' + ((e.target && (e.target.src || e.target.href)) || ''))
            setTimeout(function () {
              show(m)
            }, 1200)
          },
          true
        )
        window.addEventListener('unhandledrejection', function (e) {
          setTimeout(function () {
            show((e.reason && e.reason.message) || e.reason)
          }, 1200)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
